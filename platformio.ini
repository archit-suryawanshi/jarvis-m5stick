; Jarvis: hold the front button, ask a question, read the answer.
; M5StickC Plus2 (ESP32-PICO-V3-02, 8 MB flash, 2 MB PSRAM).

[env:m5stickc-plus2]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
; The Plus2's CH9102 USB-UART bridge is unreliable above 230400 baud.
upload_speed = 230400
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@^0.2.7
    bblanchon/ArduinoJson@^7.2.0
